name: weed windows build on FoundationDB 7.3

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  FDB_TAG: 7.3.79-weftspun-dev.4
  LLVM_MINGW: 20261104
  WINFSP_URL: https://github.com/winfsp/winfsp/releases/download/v2.1/winfsp-2.1.25156.msi
  WINFSP_SHA256: 073a70e00f77423e34bed98b86e600def93393ba5822204fac57a29324db9f7a

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Fetch FDB assets, verify, unpack headers
        shell: pwsh
        run: |
          $b = "https://github.com/V-Sekai-fire/datasource-foundationdb/releases/download/$env:FDB_TAG"
          foreach ($f in 'SHA256SUMS.windows','fdb_c.windows.x86_64.dll','foundationdb-7.3.82-SNAPSHOT-x64.msi') {
            curl.exe -sSfL -o $f "$b/$f"
          }
          foreach ($l in Get-Content SHA256SUMS.windows) {
            $h,$n = $l -split ' \*',2
            if (-not (Test-Path $n)) { continue }
            if ((Get-FileHash $n -Algorithm SHA256).Hash.ToLower() -ne $h) { throw "sha256 mismatch: $n" }
            "ok $n"
          }
          Start-Process msiexec -ArgumentList '/a',"$PWD\foundationdb-7.3.82-SNAPSHOT-x64.msi",'/qn',"TARGETDIR=$PWD\msi" -Wait
          if (-not (Test-Path msi\PFiles\foundationdb\include\foundationdb\fdb_c.h)) { throw 'fdb_c.h missing from MSI' }

      - name: Install WinFsp headers (ephemeral runner)
        shell: pwsh
        run: |
          curl.exe -sSfL -o winfsp.msi $env:WINFSP_URL
          if ((Get-FileHash winfsp.msi -Algorithm SHA256).Hash.ToLower() -ne $env:WINFSP_SHA256) { throw 'winfsp sha256 mismatch' }
          Start-Process msiexec -ArgumentList '/i',"$PWD\winfsp.msi",'/qn','INSTALLLEVEL=1000' -Wait
          # Copy the headers to a path without spaces: cgo splits CGO_CFLAGS on spaces.
          Copy-Item 'C:\Program Files (x86)\WinFsp\inc\fuse' "$PWD\winfsp-inc" -Recurse
          if (-not (Test-Path "$PWD\winfsp-inc\fuse_common.h")) { throw 'fuse_common.h missing' }

      - name: Fetch llvm-mingw
        shell: pwsh
        run: |
          curl.exe -sSfL -o llvm.zip "https://github.com/mstorsjo/llvm-mingw/releases/download/$env:LLVM_MINGW/llvm-mingw-$env:LLVM_MINGW-ucrt-x86_64.zip"
          Expand-Archive llvm.zip -DestinationPath llvm-x
          Move-Item (Get-ChildItem llvm-x -Directory | Select-Object -First 1).FullName llvm-mingw

      - name: Build weed.exe with the foundationdb tag
        shell: pwsh
        run: |
          $root = $PWD.Path
          $env:Path = "$root\llvm-mingw\bin;" + $env:Path
          $inc = "$root\msi\PFiles\foundationdb\include"
          $lib = "$root\msi\PFiles\foundationdb\lib\foundationdb"
          $env:CGO_ENABLED = '1'
          $env:CC = 'x86_64-w64-mingw32-clang'
          $env:CGO_CFLAGS = "-I$inc -I$root\winfsp-inc"
          $env:CGO_LDFLAGS = "-L$lib -lfdb_c"
          go build -tags foundationdb -o weed.exe ./weed
          if ($LASTEXITCODE -ne 0) {
            # fall back to a MinGW import library made from the DLL
            llvm-readobj --coff-exports msi\PFiles\foundationdb\bin\fdb_c.dll | Select-String 'Name:' |
              ForEach-Object { $_.Line.Trim() -replace '^Name:\s*','' } | Sort-Object -Unique | Set-Content syms.txt
            ("LIBRARY fdb_c.dll`nEXPORTS`n" + ((Get-Content syms.txt) -join "`n")) | Set-Content fdb_c.def
            New-Item -ItemType Directory -Force mingwlib | Out-Null
            llvm-dlltool -m i386:x86-64 -d fdb_c.def -l mingwlib\libfdb_c.a
            $env:CGO_LDFLAGS = "-L$root\mingwlib -lfdb_c"
            go build -tags foundationdb -o weed.exe ./weed
          }
          if (-not (Test-Path weed.exe)) { throw 'build failed' }

      - name: Static checks (unit level)
        shell: pwsh
        run: |
          $env:Path = "$PWD\llvm-mingw\bin;" + $env:Path
          ./weed.exe version
          $imports = llvm-readobj --coff-imports weed.exe | Out-String
          if ($imports -notmatch 'fdb_c\.dll') { throw 'weed.exe does not import fdb_c.dll: foundationdb tag not linked' }
          'fdb_c.dll imported'
          # control: a build without the tag must not import it
          $env:CGO_ENABLED = '1'; $env:CC = 'x86_64-w64-mingw32-clang'
          $env:CGO_CFLAGS = "-I$PWD\winfsp-inc"
          go build -o weed-notag.exe ./weed
          $ctl = llvm-readobj --coff-imports weed-notag.exe | Out-String
          if ($ctl -match 'fdb_c\.dll') { throw 'control failed: untagged build imports fdb_c.dll' }
          'control ok'

      - name: Checksums
        shell: pwsh
        run: |
          Copy-Item weed.exe weed.windows.x86_64.exe
          Get-FileHash weed.windows.x86_64.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower()) *weed.windows.x86_64.exe" } | Set-Content SHA256SUMS

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: weed-windows-x86_64
          path: |
            weed.windows.x86_64.exe
            SHA256SUMS

  # The one CPU integration job (operator exception, 2026-11-08): FDB 7.3 + weed + S3 + restart + desync.
  gate:
    needs: windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: weed-windows-x86_64
          path: weed-art

      - name: Gate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $g = "$PWD\gate"; New-Item -ItemType Directory -Force $g, "$g\data", "$g\logs", "$g\vol" | Out-Null
          $results = [ordered]@{}
          function Check($name, [bool]$ok, $detail = '') {
            $results[$name] = $ok
            "{0} {1} {2}" -f $(if ($ok) { 'PASS' } else { 'FAIL' }), $name, $detail
          }
          function Wait-Until([scriptblock]$t, [int]$s) {
            $end = (Get-Date).AddSeconds($s)
            while ((Get-Date) -lt $end) { if (& $t) { return $true }; Start-Sleep 1 }
            return $false
          }
          function Sha($f) { (Get-FileHash $f -Algorithm SHA256).Hash.ToLower() }

          # --- inputs, each checked by sha256
          Copy-Item weed-art\weed.windows.x86_64.exe "$g\weed.exe"
          $b = "https://github.com/V-Sekai-fire/datasource-foundationdb/releases/download/$env:FDB_TAG"
          foreach ($f in 'SHA256SUMS.windows','fdbserver.windows.x86_64.exe','fdbcli.windows.x86_64.exe','fdb_c.windows.x86_64.dll') { curl.exe -sSfL -o "$g\$f" "$b/$f" }

          # fdbbackup/backup_agent/fdbrestore are not loose release assets; they live only inside the MSI.
          curl.exe -sSfL -o "$g\fdb.msi" "$b/foundationdb-7.3.82-SNAPSHOT-x64.msi"
          if ((Sha "$g\fdb.msi") -ne ((Get-Content "$g\SHA256SUMS.windows" | Select-String 'foundationdb-7\.3\.82-SNAPSHOT-x64\.msi$').Line -split ' ')[0]) { throw 'sha256 mismatch: foundationdb-7.3.82-SNAPSHOT-x64.msi' }
          Start-Process msiexec -ArgumentList '/a',"$g\fdb.msi",'/qn',"TARGETDIR=$g\msi" -Wait
          foreach ($p in 'fdbbackup','backup_agent','fdbrestore') {
            Copy-Item "$g\msi\PFiles\foundationdb\bin\$p.exe" "$g\$p.exe"
          }
          foreach ($l in Get-Content "$g\SHA256SUMS.windows") {
            $h, $n = $l -split ' \*', 2
            if ((Test-Path "$g\$n") -and ((Sha "$g\$n") -ne $h)) { throw "sha256 mismatch: $n" }
          }
          Move-Item "$g\fdbserver.windows.x86_64.exe" "$g\fdbserver.exe"
          Move-Item "$g\fdbcli.windows.x86_64.exe" "$g\fdbcli.exe"
          Move-Item "$g\fdb_c.windows.x86_64.dll" "$g\fdb_c.dll"
          curl.exe -sSfL -o "$g\desync.zip" https://github.com/folbricht/desync/releases/download/v1.1.5/desync_1.1.5_windows_amd64.zip
          if ((Sha "$g\desync.zip") -ne '114a18e415842d939fc3578e7f486f06d78ce536379bb2b6320879baa4c4e80e') { throw 'desync sha256 mismatch' }
          Expand-Archive "$g\desync.zip" "$g\desync"

          $procs = @{}
          function Start-Fdb { $procs.fdb = Start-Process "$g\fdbserver.exe" -ArgumentList '-C',"$g\fdb.cluster",'-p','127.0.0.1:4500','-d',"$g\data",'-L',"$g\logs" -PassThru -WindowStyle Hidden }
          function Fdbcli($c) { & "$g\fdbcli.exe" -C "$g\fdb.cluster" --timeout 20 --exec $c 2>&1 | Out-String }
          function Fdb-Up { Wait-Until { (Fdbcli 'status minimal') -match 'available' } 60 }
          function Key-Count { $o = (Fdbcli 'getrangekeys \x00 \xff 10000') -split "`n"; @($o | Where-Object { $_ -match '^`' }).Count }
          $toml = "$g\filer.toml"
          function Write-Toml($ver) {
            $cf = $g -replace '\\','/'
            "[leveldb2]`nenabled = false`n[foundationdb]`nenabled = true`ncluster_file = `"$cf/fdb.cluster`"`napi_version = $ver`ntimeout = `"5s`"`ndirectory_prefix = `"seaweedfs`"`n" | Set-Content $toml -NoNewline
          }
          $script:n = 0
          function Start-Weed { $script:n++; $procs.weed = Start-Process "$g\weed.exe" -ArgumentList 'server','-ip=127.0.0.1','-dir=vol','-master.volumeSizeLimitMB=128','-volume.max=8','-filer','-s3','-s3.config=s3.json' -WorkingDirectory $g -RedirectStandardOutput "$g\weed$($script:n).out" -RedirectStandardError "$g\weed$($script:n).err" -PassThru -WindowStyle Hidden }
          function Weed-Up { Wait-Until { (curl.exe -s -o NUL -w '%{http_code}' http://127.0.0.1:8888/) -eq '200' -and (curl.exe -s -o NUL -w '%{http_code}' http://127.0.0.1:8333/) -ne '000' } 90 }
          function Stop-P($k) { if ($procs[$k] -and -not $procs[$k].HasExited) { Stop-Process -Id $procs[$k].Id -Force }; Start-Sleep 2 }

          $env:AWS_ACCESS_KEY_ID = 'gatekey'; $env:AWS_SECRET_ACCESS_KEY = 'gatesecret'; $env:AWS_DEFAULT_REGION = 'us-east-1'
          $env:AWS_REQUEST_CHECKSUM_CALCULATION = 'when_required'; $env:AWS_RESPONSE_CHECKSUM_VALIDATION = 'when_required'
          $env:AWS_MAX_ATTEMPTS = '1'; $env:AWS_EC2_METADATA_DISABLED = 'true'
          $ep = 'http://127.0.0.1:8333'
          function S3($a) { $o = & aws --endpoint-url $ep --cli-connect-timeout 5 --cli-read-timeout 25 @a 2>&1 | Out-String; [pscustomobject]@{ Code = $LASTEXITCODE; Out = $o } }
          '{"identities":[{"name":"gate","credentials":[{"accessKey":"gatekey","secretKey":"gatesecret"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' | Set-Content "$g\s3.json"

          try {
            # 1. FDB alive
            'gate:gate@127.0.0.1:4500' | Set-Content "$g\fdb.cluster" -NoNewline
            Start-Fdb; Start-Sleep 3
            (Fdbcli 'configure new single memory') | Out-Null
            Check '1 fdb available' (Fdb-Up)
            (Fdbcli 'writemode on; set gatekey gatevalue') | Out-Null
            Check '1 fdb key roundtrip' ((Fdbcli 'get gatekey') -match 'gatevalue')

            # 2. control first: api_version 740 must be refused by the 7.3 client
            Write-Toml 740; Start-Weed
            $exited = Wait-Until { $procs.weed.HasExited } 40
            Check '2 control: api_version 740 refused' $exited ("exit=" + $(if ($exited) { $procs.weed.ExitCode } else { 'still running' }))
            Stop-P 'weed'
            Get-Content "$g\weed1.err" -Tail 5 -ErrorAction SilentlyContinue

            # 2. store selection: api_version 730
            Write-Toml 730; Start-Weed
            Check '2 weed up on the FDB store' (Weed-Up)
            Check '2 log names the foundationdb store' ((Get-Content "$g\weed2.out","$g\weed2.err" -ErrorAction SilentlyContinue | Out-String) -match '(?i)foundationdb')

            # 3. metadata lands in FDB
            $r = S3 @('s3api','create-bucket','--bucket','gate')
            Check '4 create bucket' ($r.Code -eq 0) $r.Out
            $before = Key-Count
            $bytes = New-Object byte[] (8MB); [Security.Cryptography.RandomNumberGenerator]::Fill($bytes); [IO.File]::WriteAllBytes("$g\obj.bin", $bytes)
            $want = Sha "$g\obj.bin"
            $r = S3 @('s3api','put-object','--bucket','gate','--key','obj8m','--body',"$g\obj.bin")
            Check '4 s3 put' ($r.Code -eq 0) $r.Out
            $after = Key-Count
            Check '3 fdb key count rose after the put' ($after -gt $before) "before=$before after=$after"

            # 4. S3 round trip and controls
            $r = S3 @('s3api','get-object','--bucket','gate','--key','obj8m',"$g\back.bin")
            Check '4 s3 get sha256 matches' ($r.Code -eq 0 -and (Sha "$g\back.bin") -eq $want)
            $env:AWS_SECRET_ACCESS_KEY = 'wrong'
            $r = S3 @('s3api','list-objects-v2','--bucket','gate')
            $env:AWS_SECRET_ACCESS_KEY = 'gatesecret'
            Check '4 control: wrong secret refused' ($r.Code -ne 0 -and $r.Out -match '403|Forbidden|SignatureDoesNotMatch|AccessDenied')
            Stop-P 'fdb'
            $r = S3 @('s3api','put-object','--bucket','gate','--key','while-fdb-down','--body',"$g\obj.bin")
            Check '4 control: put fails with fdbserver stopped' ($r.Code -ne 0)

            # 5. restart both, same bytes
            Stop-P 'weed'
            Start-Fdb
            Check '5 fdb back up after restart' (Fdb-Up)
            Start-Weed
            Check '5 weed back up after restart' (Weed-Up)
            Remove-Item "$g\back.bin" -ErrorAction SilentlyContinue
            $ok2 = Wait-Until {
              Remove-Item "$g\back.bin" -ErrorAction SilentlyContinue
              $r = S3 @('s3api','get-object','--bucket','gate','--key','obj8m',"$g\back.bin")
              $r.Code -eq 0 -and (Test-Path "$g\back.bin") -and (Sha "$g\back.bin") -eq $want
            } 20
            Check '5 get after restart sha256 matches' $ok2 $r.Out

            # 6. desync through the S3 gateway
            $env:S3_ACCESS_KEY = 'gatekey'; $env:S3_SECRET_KEY = 'gatesecret'; $env:S3_REGION = 'us-east-1'
            $store = 's3+http://127.0.0.1:8333/gate/store'
            $d = Get-ChildItem "$g\desync" -Recurse -Filter desync.exe | Select-Object -First 1 -ExpandProperty FullName
            $o = & $d make -s $store "$g\obj.caibx" "$g\obj.bin" 2>&1 | Out-String
            Check '6 desync make' ($LASTEXITCODE -eq 0) $o
            $o = & $d extract -s $store "$g\obj.caibx" "$g\ext1.bin" 2>&1 | Out-String
            Check '6 desync extract sha256 matches' ($LASTEXITCODE -eq 0 -and (Sha "$g\ext1.bin") -eq $want) $o
            $key = (S3 @('s3api','list-objects-v2','--bucket','gate','--prefix','store/','--query','Contents[0].Key','--output','text')).Out.Trim()
            Check '6 chunk object found' ($key -match 'cacnk') $key
            [IO.File]::WriteAllBytes("$g\garbage.bin", (New-Object byte[] 4096))
            (S3 @('s3api','put-object','--bucket','gate','--key',$key,'--body',"$g\garbage.bin")) | Out-Null
            $o = & $d extract -s $store "$g\obj.caibx" "$g\ext2.bin" 2>&1 | Out-String
            Check '6 control: corrupted chunk makes extract fail' ($LASTEXITCODE -ne 0) $o

            # 7. fdbbackup to file://, restore into a second cluster, compare the key.
            #
            # Three bugs found and fixed here by a local macOS repro against real fdbbackup/
            # fdbrestore 7.3.82 binaries (datasource-foundationdb#17's fix is unrelated and
            # unaffected -- this gate was never actually exercising it past this point):
            #  (a) fdbbackup status's real completion text is "... completed at version N",
            #      never the literal phrase "has completed" this used to grep for -- that
            #      check was destined to time out on any OS, backup healthy or not.
            #  (b) restore's -r needs the exact backup-<timestamp> sub-URL fdbbackup -d just
            #      created, not the bare container path; passing the bare path fails restore
            #      immediately ("not restorable to any version"), which Windows's buffered-I/O
            #      error path reports as the far less legible "Disk i/o operation failed".
            #  (c) a restore submitted to the destination cluster needs an agent running
            #      against THAT cluster too, not only the source -- otherwise it sits queued
            #      forever with CurrentVersion -1 and nothing ever picks it up.
            # Also: the original Wait-Until-based polling assigned $status inside a scriptblock
            # invoked via `& $t`, which does not propagate back to this scope in PowerShell, so
            # Check always printed an empty detail line regardless of what fdbbackup actually
            # said -- replaced with a plain inline loop so the diagnostic text is real.
            New-Item -ItemType Directory -Force "$g\backupdest", "$g\data2", "$g\logs2" | Out-Null
            $procs.agent = Start-Process "$g\backup_agent.exe" -ArgumentList '-C',"$g\fdb.cluster" -RedirectStandardOutput "$g\agent.out" -RedirectStandardError "$g\agent.err" -PassThru -WindowStyle Hidden
            Start-Sleep 5
            $dest = "file://" + "$g\backupdest"
            $o = & "$g\fdbbackup.exe" start -C "$g\fdb.cluster" -d $dest 2>&1 | Out-String
            Check '7 fdbbackup start submitted' ($LASTEXITCODE -eq 0) $o
            $status = ''
            $done = $false
            # -s/--snapshot-interval does not speed this up: measured locally (macOS, 12 cores)
            # at ~35s with the default 864000s interval AND with -s 5, so the latency is some
            # other fixed minimum in FileBackupAgent's task machinery, not interval-tunable. The
            # Windows runner is slower than that baseline (seen still "just started" at 90s), so
            # the bound is set to 5x the measured local baseline, not an arbitrary round number.
            for ($i = 0; $i -lt 180; $i++) {
              $status = & "$g\fdbbackup.exe" status -C "$g\fdb.cluster" 2>&1 | Out-String
              if ($status -match '(?i)completed at version') { $done = $true; break }
              Start-Sleep 1
            }
            Check '7 fdbbackup status reports completed' $done $status
            if ($status -match 'BackupURL:\s*(\S+)') {
              $backupUrl = $Matches[1]
              Check '7 fdbbackup reported a BackupURL' $true $backupUrl
            } else {
              $backupUrl = $dest
              Check '7 fdbbackup reported a BackupURL' $false $status
            }
            Stop-P 'agent'
            'second:second@127.0.0.1:4501' | Set-Content "$g\fdb2.cluster" -NoNewline
            $procs.fdb2 = Start-Process "$g\fdbserver.exe" -ArgumentList '-C',"$g\fdb2.cluster",'-p','127.0.0.1:4501','-d',"$g\data2",'-L',"$g\logs2" -PassThru -WindowStyle Hidden
            Start-Sleep 3
            (& "$g\fdbcli.exe" -C "$g\fdb2.cluster" --timeout 20 --exec 'configure new single memory') | Out-Null
            Check '7 second fdb available' ((Wait-Until { (& "$g\fdbcli.exe" -C "$g\fdb2.cluster" --timeout 10 --exec 'status minimal' 2>&1 | Out-String) -match 'available' } 60))
            # A restore agent against the DESTINATION cluster -- not the source one started above.
            $procs.agent2 = Start-Process "$g\backup_agent.exe" -ArgumentList '-C',"$g\fdb2.cluster" -RedirectStandardOutput "$g\agent2.out" -RedirectStandardError "$g\agent2.err" -PassThru -WindowStyle Hidden
            Start-Sleep 5
            $o = & "$g\fdbrestore.exe" start --dest-cluster-file "$g\fdb2.cluster" -r $backupUrl 2>&1 | Out-String
            Check '7 fdbrestore start submitted' ($LASTEXITCODE -eq 0) $o
            $rstatus = ''
            $rdone = $false
            for ($i = 0; $i -lt 180; $i++) {
              $rstatus = & "$g\fdbrestore.exe" status --dest-cluster-file "$g\fdb2.cluster" 2>&1 | Out-String
              if ($rstatus -match '(?i)state:\s*completed') { $rdone = $true; break }
              Start-Sleep 1
            }
            Check '7 fdbrestore status reports completed' $rdone $rstatus
            Stop-P 'agent2'
            $restored = & "$g\fdbcli.exe" -C "$g\fdb2.cluster" --timeout 20 --exec 'get gatekey' 2>&1 | Out-String
            Check '7 restored key matches' ($restored -match 'gatevalue') $restored
            Check '7 control: backup dest is separate from the live cluster, not the FDB under test' (Test-Path "$g\backupdest") "dest=$dest"
          }
          finally {
            Stop-P 'weed'; Stop-P 'fdb'
            Stop-P 'fdb2'
            $sum = $results.GetEnumerator() | ForEach-Object { "{0} {1}" -f $(if ($_.Value) { 'PASS' } else { 'FAIL' }), $_.Key }
            $sum | Set-Content "$g\summary.txt"
            "### Gate`n" + (($sum | ForEach-Object { "- $_" }) -join "`n") | Add-Content $env:GITHUB_STEP_SUMMARY
          }
          $failed = @($results.Keys | Where-Object { -not $results[$_] }).Count
          "checks: $($results.Count), failed: $failed"
          if ($results.Count -lt 26 -or $failed -gt 0) { exit 1 }
          exit 0

      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gate-logs
          path: |
            gate/summary.txt
            gate/*.out
            gate/*.err
            gate/filer.toml
            gate/agent.*
            gate/logs/**
            gate/logs2/**
